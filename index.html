<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensajes en vivo · Aruba Apple</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0b0710; --card:rgba(255,255,255,0.075); --card-b:rgba(255,255,255,0.18);
  --grad1:#ff2fb0; --grad2:#b23bf0; --pink2:#ff6fc6;
  --txt:#f3eef6; --txt2:#a99cb0; --txt3:#746a7c;
  --green:#4ee08a; --red:#ff5470;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(700px 500px at -5% -10%, rgba(255,45,168,0.35), transparent 60%),
    radial-gradient(700px 500px at 105% 110%, rgba(130,30,220,0.30), transparent 60%);
  background-attachment:fixed; min-height:100vh;
  color:var(--txt); font-family:'Inter',sans-serif; padding:28px;
}
h1{font-family:'Manrope'; font-weight:800; font-size:26px; margin-bottom:4px;}
.sub{color:var(--txt2); font-size:13px; margin-bottom:22px;}
#estado{font-size:12px; margin-bottom:18px;}
.columns{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px;}
.card{
  background:var(--card); border:2px solid var(--card-b); border-radius:18px; padding:20px;
  animation:pulseGlow 2.8s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{ box-shadow:0 0 18px rgba(var(--glow-rgb),0.2); border-color:rgba(var(--glow-rgb),0.5); }
  50%{ box-shadow:0 0 40px rgba(var(--glow-rgb),0.5); border-color:rgba(var(--glow-rgb),0.9); }
}
.card h2{font-family:'Manrope'; font-size:16px; margin-bottom:4px;}
.badge{display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(255,255,255,0.08); color:var(--txt2); margin-bottom:12px;}
.field{margin-bottom:8px;}
.field label{display:block; font-size:11px; color:var(--txt3); margin-bottom:3px;}
input{
  width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--card-b); border-radius:8px;
  color:var(--txt); font-family:'Inter'; font-size:13px; padding:8px 10px; outline:none;
}
input:focus{border-color:var(--pink2);}
.btn{
  background:linear-gradient(135deg,var(--grad1),var(--grad2)); border:none; color:#fff;
  padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; width:100%; margin-top:6px;
}
.btn.ghost{background:transparent; border:1px solid var(--card-b); color:var(--txt2);}
.list{
  margin-top:14px; border:1px solid var(--card-b); border-radius:12px; background:rgba(0,0,0,0.2);
  height:320px; overflow-y:auto; padding:12px; display:flex; flex-direction:column;
}
.msg{max-width:85%; margin-bottom:8px; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.4;}
.msg.in{background:rgba(255,255,255,0.07); align-self:flex-start;}
.msg.out{background:linear-gradient(135deg,var(--grad1),var(--grad2)); color:#fff; align-self:flex-end;}
.msg .nombre{font-size:10.5px; color:var(--txt3); margin-bottom:2px;}
.reply{display:flex; gap:8px; margin-top:10px;}
.reply input{flex:1;}
.reply button{width:auto; margin-top:0; white-space:nowrap;}
.err{color:var(--red); font-size:11px; text-align:center; margin-top:4px;}
.vacio{color:var(--txt3); font-size:12px; text-align:center; margin:auto;}
</style>
</head>
<body>

<h1>Mensajes en vivo · Aruba Apple</h1>
<div class="sub">WhatsApp, Messenger e Instagram, conectados en tiempo real.</div>
<div id="estado"></div>
<div class="columns" id="grid"></div>

<script>
const SUPABASE_URL = 'https://vbbdxqxnjzziqteomuxp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiYmR4cXhuanp6aXF0ZW9tdXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTE3MzUsImV4cCI6MjEwNjIyNzczNX0.1mFzuiOIsfZZvJnALkoUOiIspyzGdJKhUGm7dzZnnds';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CANALES = [
  { id:'whatsapp', nombre:'WhatsApp Business', glow:'78,224,138', campos:[
      {k:'numero', label:'Número (con código de país)', placeholder:'Ej: 5491122334455'},
      {k:'phoneId', label:'Phone Number ID', placeholder:'De Meta for Developers'},
      {k:'token', label:'Access Token', placeholder:'Token de acceso de la API'}
    ]},
  { id:'messenger', nombre:'Messenger', glow:'0,132,255', campos:[
      {k:'pagina', label:'Nombre de la página', placeholder:'Ej: nombredetupagina'},
      {k:'pageId', label:'Page ID', placeholder:'ID de la página de Facebook'},
      {k:'token', label:'Page Access Token', placeholder:'Token de acceso de la página'}
    ]},
  { id:'instagram', nombre:'Instagram', glow:'255,140,0', campos:[
      {k:'usuario', label:'Usuario', placeholder:'Ej: tuusuario (sin @)'},
      {k:'igId', label:'IG Business Account ID', placeholder:'De Meta for Developers'},
      {k:'token', label:'Access Token', placeholder:'Token de acceso de la API'}
    ]}
];

const ultimoContacto = {};

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function cargarConfig(id){
  const { data } = await sb.from('canales_config').select('config,activo').eq('canal', id).maybeSingle();
  return data || { config:{}, activo:false };
}

async function guardarConfig(id){
  const canal = CANALES.find(c=>c.id===id);
  const cfg = {};
  canal.campos.forEach(f=>{ cfg[f.k] = document.getElementById(`c_${id}_${f.k}`).value.trim(); });
  const estado = document.getElementById(`c_${id}_estado`);
  estado.textContent = 'Guardando...'; estado.style.color = 'var(--txt3)';
  try{
    const { error } = await sb.functions.invoke('guardar-config-canal', { body: { canal:id, config:cfg } });
    if(error) throw error;
    estado.textContent = 'Guardado ✓'; estado.style.color = 'var(--green)';
  }catch(e){
    estado.textContent = 'Error: '+(e.message||e); estado.style.color = 'var(--red)';
  }
}

function pintarMensaje(canalId, m){
  const cont = document.getElementById(`list_${canalId}`);
  if(!cont) return;
  const vacio = cont.querySelector('.vacio');
  if(vacio) vacio.remove();
  const esIn = m.direccion === 'entrante';
  if(esIn && m.de) ultimoContacto[canalId] = m.de;
  const div = document.createElement('div');
  div.className = 'msg ' + (esIn ? 'in' : 'out');
  div.innerHTML = (esIn && m.nombre_contacto ? `<div class="nombre">${escapeHtml(m.nombre_contacto)}</div>` : '') + escapeHtml(m.texto);
  cont.appendChild(div);
  cont.scrollTop = cont.scrollHeight;
}

async function cargarHistorial(id){
  const cont = document.getElementById(`list_${id}`);
  const { data, error } = await sb.from('mensajes').select('*').eq('canal', id).order('creado_en', { ascending:true }).limit(50);
  if(error){ cont.innerHTML = `<div class="vacio">No se pudo cargar: ${escapeHtml(error.message)}</div>`; return; }
  cont.innerHTML = data.length ? '' : '<div class="vacio">Sin conversaciones todavía.</div>';
  data.forEach(m=>pintarMensaje(id, m));
}

async function enviar(id){
  const input = document.getElementById(`input_${id}`);
  const texto = input.value.trim();
  const destinatario = ultimoContacto[id];
  const cont = document.getElementById(`list_${id}`);
  if(!texto) return;
  if(!destinatario){
    const av = document.createElement('div'); av.className='err'; av.textContent='Todavía no hay ningún contacto que te haya escrito acá.';
    cont.appendChild(av); return;
  }
  input.disabled = true;
  try{
    const { data, error } = await sb.functions.invoke('enviar-mensaje', { body: { canal:id, destinatario, texto } });
    if(error || (data && data.error)) throw new Error((data&&data.error)||error.message);
    input.value = '';
  }catch(e){
    const av = document.createElement('div'); av.className='err'; av.textContent='No se pudo enviar: '+(e.message||e);
    cont.appendChild(av);
  }
  input.disabled = false;
  input.focus();
}

async function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(const c of CANALES){
    const { config, activo } = await cargarConfig(c.id);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--glow-rgb', c.glow);
    card.innerHTML = `
      <h2>${c.nombre}</h2>
      <span class="badge">${activo ? 'credenciales cargadas' : 'no conectado'}</span>
      ${c.campos.map(f=>`
        <div class="field"><label>${f.label}</label><input id="c_${c.id}_${f.k}" value="${escapeHtml(config[f.k]||'')}" placeholder="${f.placeholder}"></div>
      `).join('')}
      <button class="btn ghost" onclick="guardarConfig('${c.id}')">Guardar</button>
      <div id="c_${c.id}_estado" style="font-size:11px; margin-top:4px; min-height:14px;"></div>
      <div class="list" id="list_${c.id}"><div class="vacio">Cargando...</div></div>
      <div class="reply">
        <input id="input_${c.id}" placeholder="Escribí una respuesta..." onkeydown="if(event.key==='Enter') enviar('${c.id}')">
        <button class="btn" style="width:auto;" onclick="enviar('${c.id}')">Enviar</button>
      </div>`;
    grid.appendChild(card);
    cargarHistorial(c.id);
  }

  sb.channel('mensajes-en-vivo')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'mensajes' }, payload=>{
      pintarMensaje(payload.new.canal, payload.new);
    })
    .subscribe(status=>{
      const el = document.getElementById('estado');
      el.textContent = status === 'SUBSCRIBED' ? 'Conectado en vivo ✓' : ('Estado: '+status);
      el.style.color = status === 'SUBSCRIBED' ? 'var(--green)' : 'var(--txt3)';
    });
}

render();
</script>
</body>
</html>
