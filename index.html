<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensajes · Aruba Apple</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0b0710; --card:rgba(255,255,255,0.075); --card-b:rgba(255,255,255,0.18);
  --grad1:#ff2fb0; --grad2:#b23bf0; --pink2:#ff6fc6;
  --txt:#f3eef6; --txt2:#a99cb0; --txt3:#746a7c;
  --green:#4ee08a; --red:#ff5470; --amber:#ffcf5c;
  --wa:#25d366; --ms:#006aff; --ig:#dd2a7b;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(700px 500px at -5% -10%, rgba(255,45,168,0.35), transparent 60%),
    radial-gradient(700px 500px at 105% 110%, rgba(130,30,220,0.30), transparent 60%);
  background-attachment:fixed;
  color:var(--txt); font-family:'Inter',sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
h1{font-family:'Manrope'; font-weight:800; font-size:18px;}
button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}

/* ===== LOGIN ===== */
#loginOverlay{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;
  background:var(--bg); overflow:hidden;}
#loginOverlay::before{
  content:''; position:absolute; width:600px; height:600px; top:50%; left:50%; transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,47,176,0.30) 0%, rgba(178,59,240,0.20) 40%, transparent 70%);
  animation:loginGlowPulse 4s ease-in-out infinite; pointer-events:none; z-index:0;
}
#loginOverlay::after{
  content:''; position:absolute; width:400px; height:400px; top:50%; left:50%; transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,111,198,0.18) 0%, transparent 60%);
  animation:loginGlowPulse2 3s ease-in-out infinite 1s; pointer-events:none; z-index:0;
}
@keyframes loginGlowPulse{
  0%,100%{ opacity:0.5; transform:translate(-50%,-50%) scale(0.9); }
  50%{ opacity:1; transform:translate(-50%,-50%) scale(1.15); }
}
@keyframes loginGlowPulse2{
  0%,100%{ opacity:0.3; transform:translate(-50%,-50%) scale(1); }
  50%{ opacity:0.7; transform:translate(-50%,-50%) scale(1.1); }
}
#loginOverlay .login-orb{position:absolute; border-radius:50%; pointer-events:none; z-index:0; filter:blur(60px);}
#loginOverlay .login-orb.orb1{width:300px; height:300px; top:-10%; left:-8%; background:rgba(255,47,176,0.25); animation:orbFloat1 8s ease-in-out infinite;}
#loginOverlay .login-orb.orb2{width:250px; height:250px; bottom:-8%; right:-6%; background:rgba(178,59,240,0.25); animation:orbFloat2 10s ease-in-out infinite;}
#loginOverlay .login-orb.orb3{width:180px; height:180px; top:20%; right:15%; background:rgba(255,111,198,0.15); animation:orbFloat3 7s ease-in-out infinite;}
@keyframes orbFloat1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(40px,30px); } }
@keyframes orbFloat2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-30px,-40px); } }
@keyframes orbFloat3{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-20px,20px) scale(1.15); } }
.login-card{
  width:400px; max-width:100%; position:relative; z-index:1;
  background:rgba(18,10,28,0.75); backdrop-filter:blur(24px) saturate(1.5); -webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(255,111,198,0.25); border-radius:24px; padding:40px 36px;
  box-shadow:0 0 80px rgba(255,47,176,0.15), 0 0 40px rgba(178,59,240,0.10), 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  animation:cardEntrance 0.6s cubic-bezier(0.16,1,0.3,1) forwards, cardGlow 3s ease-in-out infinite 0.6s;
}
@keyframes cardEntrance{ 0%{ opacity:0; transform:translateY(30px) scale(0.96); } 100%{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes cardGlow{
  0%,100%{ box-shadow:0 0 60px rgba(255,47,176,0.12), 0 0 30px rgba(178,59,240,0.08), 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); border-color:rgba(255,111,198,0.20); }
  50%{ box-shadow:0 0 100px rgba(255,47,176,0.25), 0 0 50px rgba(178,59,240,0.18), 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12); border-color:rgba(255,111,198,0.45); }
}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:28px; justify-content:center;}
.login-brand .dot{width:14px; height:14px; border-radius:50%; background:linear-gradient(135deg,var(--grad1),var(--grad2)); box-shadow:0 0 18px var(--pink2), 0 0 6px var(--grad1); animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{ 0%,100%{ box-shadow:0 0 14px var(--pink2), 0 0 4px var(--grad1); transform:scale(1); } 50%{ box-shadow:0 0 24px var(--pink2), 0 0 10px var(--grad1); transform:scale(1.1); } }
.login-brand span{font-family:'Manrope'; font-weight:800; font-size:22px; letter-spacing:-0.3px;}
.login-card h2{font-size:22px; font-weight:800; margin-bottom:6px; text-align:center; background:linear-gradient(135deg, #fff 30%, var(--pink2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;}
.login-sub{color:var(--txt2); font-size:13.5px; margin-bottom:28px; text-align:center; line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; color:var(--txt2); margin-bottom:7px; letter-spacing:0.3px; text-transform:uppercase; font-weight:600;}
.field input{width:100%; padding:12px 14px; font-size:14px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:14px; color:var(--txt); font-family:'Inter'; transition:all 0.3s ease; outline:none;}
.field input::placeholder{color:var(--txt3);}
.field input:focus{border-color:var(--pink2); background:rgba(255,255,255,0.09); box-shadow:0 0 0 4px rgba(255,47,176,0.12), 0 0 20px rgba(255,47,176,0.08);}
.btn{width:100%; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:700; font-family:'Manrope'; color:#fff; cursor:pointer; position:relative; overflow:hidden; background:linear-gradient(135deg,var(--grad1),var(--grad2)); box-shadow:0 4px 20px rgba(255,47,176,0.30); transition:all 0.3s ease; margin-top:6px;}
.btn:hover{transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,47,176,0.45), 0 0 20px rgba(255,47,176,0.2);}
.btn:active{transform:translateY(0); box-shadow:0 2px 12px rgba(255,47,176,0.25);}
.btn::after{content:''; position:absolute; top:0; left:-80%; width:50%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent); transform:skewX(-20deg); transition:left 0.6s ease;}
.btn:hover::after{left:130%;}
.btn.ghost{background:transparent; border:1px solid var(--card-b); color:var(--txt2); box-shadow:none;}
.btn.ghost:hover{transform:none; box-shadow:none; border-color:var(--pink2);}
.btn.ghost::after{display:none;}
.btn.small{padding:7px 12px; font-size:12px; width:auto;}
#loginError{color:var(--red); font-size:12.5px; margin-top:14px; text-align:center; min-height:16px;}

/* ===== APP ===== */
#app{display:none; flex-direction:column; height:100vh; width:100%;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--card-b); flex-shrink:0; flex-wrap:wrap; gap:8px;}
.topbar .brand{display:flex; align-items:center; gap:8px;}
.topbar .brand .dot{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--grad1),var(--grad2)); flex-shrink:0;}
.topbar-right{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--txt2); flex-wrap:wrap;}
.topbar-right a{color:var(--pink2); cursor:pointer;}
.topbar-right a:hover{text-decoration:underline;}

/* ===== FILTROS ===== */
.filtros{display:flex; gap:8px; padding:10px 20px; flex-shrink:0; overflow-x:auto; align-items:center;}
.filtro-btn{padding:7px 14px; border-radius:20px; border:1px solid var(--card-b); background:rgba(255,255,255,0.03); color:var(--txt2); font-size:12.5px; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:7px; cursor:pointer; transition:all 0.2s;}
.filtro-btn:hover{background:rgba(255,255,255,0.06);}
.filtro-btn.active{color:#fff; border-color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.1);}
.filtro-btn .dot-estado{width:7px; height:7px; border-radius:50%; background:var(--txt3); flex-shrink:0;}
.filtro-btn .dot-estado.ok{background:var(--green);}
.filtro-btn .unread-badge{background:var(--red); color:#fff; font-size:10px; font-weight:700; min-width:17px; height:17px; border-radius:9px; display:none; align-items:center; justify-content:center; padding:0 5px;}

/* ===== PLATFORM BADGES ===== */
.plat-icon{width:20px; height:20px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; font-weight:700; color:#fff;}
.plat-icon.whatsapp{background:var(--wa);}
.plat-icon.messenger{background:var(--ms);}
.plat-icon.instagram{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);}
.plat-icon svg{width:13px; height:13px; fill:#fff;}

.plat-tag{font-size:10px; font-weight:600; padding:2px 7px; border-radius:6px; display:inline-flex; align-items:center; gap:4px; flex-shrink:0;}
.plat-tag.whatsapp{background:rgba(37,211,102,0.15); color:#4ee08a;}
.plat-tag.messenger{background:rgba(0,106,255,0.15); color:#5ca8ff;}
.plat-tag.instagram{background:rgba(221,42,123,0.15); color:#ff6fc6;}

/* ===== CHAT SHELL ===== */
.config-box{margin:0 20px 14px; background:var(--card); border:1px solid var(--card-b); border-radius:14px; padding:16px; display:none; flex-shrink:0;}
.config-box.open{display:block;}
.config-box .badge{display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(255,255,255,0.08); color:var(--txt2); margin-bottom:10px;}
.config-box .cerrar{float:right; color:var(--txt3); font-size:12px; cursor:pointer;}
.config-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--card-b);}
.config-canal-section{flex:1; min-width:260px;}
.config-canal-section h3{font-size:13px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}

.chat-shell{flex:1; display:flex; overflow:hidden; margin:0 20px 20px; border:1px solid var(--card-b); border-radius:16px; background:rgba(0,0,0,0.15); min-height:0; position:relative;}
.conv-list{width:320px; flex-shrink:0; border-right:1px solid var(--card-b); overflow-y:auto; display:flex; flex-direction:column;}
.conv-search{padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.05); flex-shrink:0;}
.conv-search input{width:100%; padding:8px 12px; font-size:12.5px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:var(--txt); outline:none;}
.conv-search input:focus{border-color:var(--pink2);}
.conv-search input::placeholder{color:var(--txt3);}
.conv-items{flex:1; overflow-y:auto;}
.conv-item{display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer; align-items:center; transition:box-shadow 0.3s; border-radius:10px; margin:4px 6px;}
.conv-item:hover{background:rgba(255,255,255,0.03);}
.conv-item.active{background:rgba(255,45,168,0.12);}
/* Resplandor por canal */
.conv-item.canal-instagram{box-shadow:0 0 14px 2px rgba(255,120,30,0.35), 0 0 32px 6px rgba(255,80,0,0.10);}
.conv-item.canal-messenger{box-shadow:0 0 14px 2px rgba(50,130,255,0.35), 0 0 32px 6px rgba(30,100,255,0.10);}
.conv-item.canal-whatsapp{box-shadow:0 0 14px 2px rgba(37,211,102,0.35), 0 0 32px 6px rgba(30,180,80,0.10);}
.conv-avatar-wrap{position:relative; flex-shrink:0;}
.conv-avatar{width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--grad1),var(--grad2)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#fff; flex-shrink:0;}
.conv-avatar-wrap .plat-icon{position:absolute; bottom:-2px; right:-4px; width:18px; height:18px; border-radius:5px; border:2px solid var(--bg); font-size:9px;}
.conv-avatar-wrap .plat-icon svg{width:11px; height:11px;}
.conv-info{flex:1; min-width:0;}
.conv-info .nombre{font-size:13.5px; font-weight:600; display:flex; justify-content:space-between; gap:6px; align-items:center;}
.conv-info .nombre .hora{font-size:10.5px; color:var(--txt3); font-weight:400; flex-shrink:0;}
.conv-info .preview{font-size:12px; color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
/* Conversación no leída: nombre en blanco brillante + preview más visible */
.conv-item.has-unread .conv-info .nombre span:first-child{color:#fff; font-weight:700;}
.conv-item.has-unread .conv-info .preview{color:var(--txt); font-weight:500;}
/* Conversación leída: nombre más tenue */
.conv-item:not(.has-unread) .conv-info .nombre span:first-child{color:var(--txt2); font-weight:500;}
.conv-unread{background:var(--pink2); color:#1a0a14; font-size:10px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px; flex-shrink:0;}
.conv-empty{color:var(--txt3); font-size:12.5px; text-align:center; padding:30px 16px;}
.asig-tag{font-size:10.5px; color:var(--txt3); margin-top:2px;}

/* Botón cerrar conversación */
.btn-cerrar-conv{padding:6px 12px; font-size:11px; font-weight:600; border:1px solid rgba(255,84,112,0.4); background:rgba(255,84,112,0.1); color:var(--red); border-radius:8px; cursor:pointer; transition:all 0.2s; font-family:'Inter';}
.btn-cerrar-conv:hover{background:rgba(255,84,112,0.2); border-color:var(--red);}
.conv-estado-tag{font-size:10px; padding:2px 7px; border-radius:6px; font-weight:600; display:inline-flex; align-items:center; gap:3px;}
.conv-estado-tag.activa{background:rgba(78,224,138,0.12); color:var(--green);}
.conv-estado-tag.cerrada{background:rgba(255,255,255,0.06); color:var(--txt3);}
.conv-estado-tag.venta{background:rgba(0,255,100,0.12); color:#00ff64; text-shadow:0 0 6px rgba(0,255,100,0.6), 0 0 12px rgba(0,255,100,0.3); animation:neonPulseGreen 2s ease-in-out infinite;}
.conv-estado-tag.indeciso{background:rgba(255,230,0,0.12); color:#ffe600; text-shadow:0 0 6px rgba(255,230,0,0.6), 0 0 12px rgba(255,230,0,0.3); animation:neonPulseYellow 2s ease-in-out infinite;}
@keyframes neonPulseGreen{0%,100%{text-shadow:0 0 4px rgba(0,255,100,0.5),0 0 8px rgba(0,255,100,0.2);}50%{text-shadow:0 0 8px rgba(0,255,100,0.8),0 0 20px rgba(0,255,100,0.4),0 0 30px rgba(0,255,100,0.2);}}
@keyframes neonPulseYellow{0%,100%{text-shadow:0 0 4px rgba(255,230,0,0.5),0 0 8px rgba(255,230,0,0.2);}50%{text-shadow:0 0 8px rgba(255,230,0,0.8),0 0 20px rgba(255,230,0,0.4),0 0 30px rgba(255,230,0,0.2);}}
.btn-venta{padding:6px 12px; font-size:11px; font-weight:600; border:1px solid rgba(0,255,100,0.4); background:rgba(0,255,100,0.08); color:#00ff64; border-radius:8px; cursor:pointer; transition:all 0.2s; font-family:'Inter';}
.btn-venta:hover{background:rgba(0,255,100,0.18); border-color:#00ff64; box-shadow:0 0 12px rgba(0,255,100,0.3);}
.btn-indeciso{padding:6px 12px; font-size:11px; font-weight:600; border:1px solid rgba(255,230,0,0.4); background:rgba(255,230,0,0.08); color:#ffe600; border-radius:8px; cursor:pointer; transition:all 0.2s; font-family:'Inter';}
.btn-indeciso:hover{background:rgba(255,230,0,0.18); border-color:#ffe600; box-shadow:0 0 12px rgba(255,230,0,0.3);}
.chat-status-btns{display:flex; gap:6px; margin-left:auto; flex-shrink:0;}

/* Barra de Nº de venta */
.venta-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--card-b); background:rgba(0,255,100,0.06); flex-shrink:0;}
.venta-bar-nro{font-size:13px; color:var(--txt); letter-spacing:0.5px;}
.venta-bar-nro b{font-family:'Manrope'; font-size:16px; color:#00ff64; letter-spacing:2px; text-shadow:0 0 8px rgba(0,255,100,0.4);}
.btn-enviar-nro{padding:7px 14px; font-size:12px; font-weight:600; border:1px solid rgba(0,255,100,0.4); background:rgba(0,255,100,0.1); color:#00ff64; border-radius:8px; cursor:pointer; transition:all 0.2s; font-family:'Inter';}
.btn-enviar-nro:hover{background:rgba(0,255,100,0.2); border-color:#00ff64; box-shadow:0 0 12px rgba(0,255,100,0.3);}
.venta-bar-eq{font-size:12px; color:var(--pink2); font-weight:600; margin-left:4px;}

/* Selector de equipo al cerrar venta */
.sel-overlay{position:fixed; inset:0; z-index:10000; background:rgba(8,4,14,0.75); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px;}
.sel-card{width:520px; max-width:100%; max-height:80vh; display:flex; flex-direction:column; background:rgba(18,10,28,0.98); border:1px solid rgba(255,111,198,0.25); border-radius:18px; box-shadow:0 25px 60px rgba(0,0,0,0.5); overflow:hidden;}
.sel-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--card-b);}
.sel-head h3{font-family:'Manrope'; font-size:16px; font-weight:800;}
.sel-close{background:none; border:none; color:var(--txt3); font-size:18px; cursor:pointer; padding:4px 8px;}
.sel-search{margin:12px 16px; padding:10px 14px; background:rgba(255,255,255,0.06); border:1px solid var(--card-b); border-radius:10px; color:var(--txt); font-size:13px; outline:none;}
.sel-search:focus{border-color:var(--pink2);}
.sel-list{flex:1; overflow-y:auto; padding:0 16px 8px;}
.sel-item{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
.sel-item-info{flex:1; min-width:0;}
.sel-item-modelo{font-family:'Manrope'; font-weight:700; font-size:13.5px;}
.sel-item-det{font-size:11.5px; color:var(--txt2); margin-top:2px;}
.sel-item-precio{display:flex; align-items:center; gap:3px; color:var(--green); font-weight:600;}
.sel-precio-input{width:80px; background:rgba(255,255,255,0.06); border:1px solid var(--card-b); border-radius:8px; color:var(--txt); font-size:13px; padding:7px 9px; outline:none;}
.sel-precio-input:focus{border-color:var(--pink2);}
.sel-foot{padding:12px 16px; border-top:1px solid var(--card-b); text-align:center;}

.chat-area{flex:1; display:flex; flex-direction:column; min-width:0;}
.chat-header{padding:14px 18px; border-bottom:1px solid var(--card-b); display:flex; align-items:center; gap:10px; flex-shrink:0;}
.chat-header .conv-avatar-wrap .conv-avatar{width:34px; height:34px; font-size:12px;}
.chat-header .nombre{font-size:14px; font-weight:700;}
.chat-header .idcontacto{font-size:11px; color:var(--txt3); display:flex; align-items:center; gap:6px;}
.chat-messages{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:8px;}
.msg{max-width:72%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.4; word-wrap:break-word;}
.msg.in{background:rgba(255,255,255,0.08); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.out{background:linear-gradient(135deg,var(--grad1),var(--grad2)); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
.msg .hora{font-size:10px; opacity:0.65; margin-top:4px; text-align:right;}
.chat-vacio{margin:auto; color:var(--txt3); font-size:13px; text-align:center; padding:30px;}
.reply-box{display:flex; gap:8px; padding:14px; border-top:1px solid var(--card-b); flex-shrink:0; flex-wrap:wrap;}
.reply-box input{flex:1; background:rgba(255,255,255,0.06); border:1px solid var(--card-b); border-radius:10px; color:var(--txt); font-size:13.5px; padding:10px 14px; outline:none; min-width:0;}
.reply-box input:focus{border-color:var(--pink2);}
.reply-box button{width:auto; padding:10px 18px; border-radius:10px; white-space:nowrap;}
.reply-box .plat-send-indicator{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--txt3); flex-shrink:0; padding:0 4px;}

let sesionActual = null;

function esAdmin(){ return sesionActual && sesionActual.rol === 'admin'; }
function claveAsig(canal, de){ return canal + ':' + de; }
function claveConv(canal, de){ return canal + '::' + de; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iniciales(nombre, de){
  const base = (nombre || de || '?').trim();
  const partes = base.split(/\s+/).filter(Boolean);
  if(partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
  return base.slice(0,2).toUpperCase();
}
function fmtHora(iso){ try{ return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function fmtHoraLista(iso){
  try{
    const d = new Date(iso); const hoy = new Date();
    if(d.toDateString() === hoy.toDateString()) return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  }catch(e){ return ''; }
}

}
function platTag(canalId){

  return `<span class="plat-tag ${canalId}">${PLAT_SVG[canalId]||''} ${c?.nombre||canalId}</span>`;
}

/* ---------- PRIVACIDAD DE CONTACTO ----------
   Los agentes NO ven el identificador del contacto (teléfono de WhatsApp,
   usuario de Instagram/Messenger) ni el nombre; sólo el administrador.
   A los agentes se les muestra una etiqueta neutra por canal + un código corto
   y estable (derivado del identificador) para poder distinguir conversaciones. */
function codigoCliente(de){
  let h = 0; const s = String(de||'');
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h.toString(36).toUpperCase().slice(-4).padStart(4,'0');
}
function nombreMostrado(conv){
  if(esAdmin()) return conv.nombre || conv.de;
  const canalNombre = CANALES.find(c=>c.id===conv.canal)?.nombre || conv.canal;
  return `Cliente ${canalNombre} #${codigoCliente(conv.de)}`;
}
function inicialesMostradas(conv){
  if(esAdmin()) return iniciales(conv.nombre, conv.de);
  return codigoCliente(conv.de).slice(0,2);
}

/* ---------- LOGIN ---------- */
async function intentarLogin(){
  const u = document.getElementById('loginUsuario').value.trim();
  const p = document.getElementById('loginClave').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!u || !p){ err.textContent = 'Completá usuario y contraseña.'; return; }
  try{
    // Usuarios unificados con el CRM: se leen de la tabla crm_datos (mismas credenciales en ambas apps)
    const { data, error } = await sb.from('crm_datos').select('clave,valor').in('clave', ['usuarios','admin_cred']);
    if(error) throw error;
    const mapa = {};
    (data||[]).forEach(row => mapa[row.clave] = row.valor);
    const adminCred = mapa.admin_cred || { usuario:'admin', clave:'admin' };
    const vendedores = Array.isArray(mapa.usuarios) ? mapa.usuarios : [];

    let sesion = null;
    if(u === adminCred.usuario && p === adminCred.clave){
      sesion = { rol:'admin', nombre:'Administrador', usuario:u, vendedorId:null };
    } else {
      const vend = vendedores.find(x => x.usuario && x.usuario === u && x.clave === p);
      if(vend) sesion = { rol:'agente', nombre:(vend.nombre + ' ' + (vend.apellido||'')).trim(), usuario:vend.usuario, vendedorId:vend.id };
    }
    if(!sesion){ err.textContent = 'Usuario o contraseña incorrectos.'; return; }

    sesionActual = sesion;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('sesionNombre').textContent = sesionActual.nombre;
    if(esAdmin()){
      document.getElementById('linkConfigAdmin').style.display = 'inline';
      // Los accesos ahora se administran desde el CRM (sección Usuarios)
    }
    iniciarApp();
  }catch(e){
    err.textContent = 'No se pudo verificar el acceso: ' + (e.message||e);
  }
}
function cerrarSesion(){ location.reload(); }

/* ---------- GESTIÓN DE ACCESOS (solo admin) ---------- */
function toggleAccesosBox(){
  const box = document.getElementById('accesosBox');
  const abrir = !box.classList.contains('open');
  box.classList.toggle('open', abrir);
  if(abrir) cargarUsuarios();
}
async function cargarUsuarios(){
  const { data, error } = await sb.from('mensajeria_usuarios').select('id,nombre,usuario,rol').order('rol', { ascending:false }).order('nombre');
  if(error){ console.error(error); return; }
  usuariosCache = data || [];
  renderUsuariosList();
}
function renderUsuariosList(){
  const cont = document.getElementById('listaUsuarios');
  if(!cont) return;
  if(!usuariosCache.length){ cont.innerHTML = '<div class="conv-empty">Sin usuarios todavía.</div>'; return; }
  cont.innerHTML = usuariosCache.map(u => `
    <div class="user-row">
      <div class="quien">${escapeHtml(u.nombre)}<small>${escapeHtml(u.usuario)} · ${u.rol==='admin' ? 'Administrador' : 'Agente'}</small></div>
      <button class="btn ghost small" onclick="borrarUsuario('${u.id}','${escapeHtml(u.nombre)}')">Borrar</button>
    </div>`).join('');
}
async function agregarUsuario(){
  if(!esAdmin()) return;
  const nombre = document.getElementById('nuevoNombre').value.trim();
  const usuario = document.getElementById('nuevoUsuario').value.trim();
  const clave = document.getElementById('nuevoClave').value;
  const rol = document.getElementById('nuevoRol').value;
  const estado = document.getElementById('nuevoUsuarioEstado');
  if(!nombre || !usuario || !clave){ estado.textContent = 'Completá nombre, usuario y contraseña.'; estado.style.color = 'var(--red)'; return; }
  estado.textContent = 'Guardando...'; estado.style.color = 'var(--txt3)';
  try{
    const { error } = await sb.from('mensajeria_usuarios').insert({ nombre, usuario, clave, rol });
    if(error) throw error;
    estado.textContent = 'Agregado ✓'; estado.style.color = 'var(--green)';
    document.getElementById('nuevoNombre').value = '';
    document.getElementById('nuevoUsuario').value = '';
    document.getElementById('nuevoClave').value = '';
    cargarUsuarios();
  }catch(e){
    estado.textContent = e.message && e.message.includes('duplicate') ? 'Ese usuario ya existe.' : 'Error: ' + (e.message||e);
    estado.style.color = 'var(--red)';
  }
}
async function borrarUsuario(id, nombre){
  if(!esAdmin()) return;
  if(!confirm(`¿Borrar el acceso de ${nombre}?`)) return;
  await sb.from('mensajeria_usuarios').delete().eq('id', id);
  cargarUsuarios();
}

/* ---------- ASIGNACIÓN DE CONVERSACIONES A AGENTES ---------- */
async function cargarAsignaciones(){
  const { data, error } = await sb.from('conversaciones_asignadas').select('*');
  asignaciones = {};
  if(!error){ (data||[]).forEach(a => {
    asignaciones[claveAsig(a.canal, a.de)] = a;
    const conv = conversaciones[a.canal]?.[a.de];
    if(conv && a.estado){
      if(a.estado === 'venta'){ conv.estadoVenta = 'venta'; conv.cerrada = true; }
      else if(a.estado === 'indeciso'){ conv.estadoVenta = 'indeciso'; }
      else if(a.estado === 'cerrada'){ conv.cerrada = true; conv.estadoVenta = null; }
      else { conv.cerrada = false; conv.estadoVenta = null; }
    }
  }); }
}
async function reclamarConversacion(canalId, de){
  const key = claveAsig(canalId, de);
  if(asignaciones[key]) return asignaciones[key].agente_usuario === sesionActual.usuario;
  const { error } = await sb.from('conversaciones_asignadas').insert({
    canal: canalId, de, agente_usuario: sesionActual.usuario, agente_nombre: sesionActual.nombre
  });
  if(error){
    const { data } = await sb.from('conversaciones_asignadas').select('*').eq('canal', canalId).eq('de', de).maybeSingle();
    if(data) asignaciones[key] = data;
    return !!data && data.agente_usuario === sesionActual.usuario;
  }
  asignaciones[key] = { canal: canalId, de, agente_usuario: sesionActual.usuario, agente_nombre: sesionActual.nombre };
  return true;
}
async function liberarConversacion(canalId, deCodificado){
  if(!esAdmin()) return;
  const de = decodeURIComponent(deCodificado);
  if(!confirm('¿Liberar esta conversación para que cualquier agente la pueda atender?')) return;
  await sb.from('conversaciones_asignadas').delete().eq('canal', canalId).eq('de', de);
  delete asignaciones[claveAsig(canalId, de)];
  renderListaUnificada();
  renderChatAbierto();
}

/* ---------- LÍMITE DE CLIENTES SIMULTÁNEOS POR AGENTE ---------- */
// Una conversación "ocupa un cupo" mientras esté asignada al agente y todavía
// no esté resuelta. Se libera al marcarla como "venta", "indeciso" o "cerrada".
function estadoOcupaCupo(estado){
  return estado !== 'venta' && estado !== 'indeciso' && estado !== 'cerrada';
}
function misConversacionesActivas(){
  if(!sesionActual) return [];
  const out = [];
  for(const key in asignaciones){
    const a = asignaciones[key];
    if(a.agente_usuario !== sesionActual.usuario) continue;
    if(!estadoOcupaCupo(a.estado)) continue;
    out.push(a);
  }
  return out;
}
function actualizarCupoAgente(){
  const cupoEl = document.getElementById('cupoAgente');
  if(!cupoEl) return;
  if(!esAdmin() && sesionActual){
    const n = misConversacionesActivas().length;
    cupoEl.style.display = 'inline';
    cupoEl.innerHTML = `Atendiendo <b style="color:${n>=LIMITE_CONV_ACTIVAS?'var(--amber)':'var(--green)'}">${n}/${LIMITE_CONV_ACTIVAS}</b>`;
  } else {
    cupoEl.style.display = 'none';
  }
}

/* ---------- CERRAR / REABRIR CONVERSACIÓN ---------- */
async function actualizarEstadoDB(canalId, de, estado){
  await sb.from('conversaciones_asignadas').update({ estado }).eq('canal', canalId).eq('de', de);
  const key = claveAsig(canalId, de);
  if(asignaciones[key]) asignaciones[key].estado = estado;
}
async function cerrarConv(canalId, deCodificado){
  const de = decodeURIComponent(deCodificado);
  if(!confirm('¿Cerrar esta conversación? El cliente quedará libre para otros agentes.')) return;
  const conv = conversaciones[canalId]?.[de];
  if(conv){ conv.cerrada = true; conv.estadoVenta = null; }
  renderListaUnificada(); renderChatAbierto();
  await actualizarEstadoDB(canalId, de, 'cerrada');
}
async function reabrirConv(canalId, deCodificado){
  const de = decodeURIComponent(deCodificado);
  const conv = conversaciones[canalId]?.[de];
  if(conv){ conv.cerrada = false; conv.estadoVenta = null; }
  renderListaUnificada(); renderChatAbierto();
  await actualizarEstadoDB(canalId, de, 'activa');
}
function generarNroVenta(existentes){
  const usados = new Set((existentes||[]).map(r => r.nro_venta));
  let nro, intentos = 0;
  do{
    nro = String(Math.floor(Math.random()*9999)+1).padStart(4,'0'); // 0001–9999, no correlativo
    intentos++;
  } while(usados.has(nro) && intentos < 100);
  return nro;
}

// Cambia el estado de un equipo en el stock del CRM (disponible / reservado / vendido)
async function marcarEquipoEstado(equipoId, nuevoEstado){
  if(!equipoId) return;
  try{
    const { data } = await sb.from('crm_datos').select('valor').eq('clave','stock_equipos').maybeSingle();
    const equipos = (data && Array.isArray(data.valor)) ? data.valor : [];
    const e = equipos.find(x => x.id === equipoId);
    if(e){
      e.estado = nuevoEstado;
      await sb.from('crm_datos').upsert({ clave:'stock_equipos', valor: equipos, actualizado_en: new Date().toISOString() });
    }
  }catch(err){ console.error('No se pudo actualizar el stock del equipo', err); }
}

async function marcarVenta(canalId, deCodificado, equipo){
  const de = decodeURIComponent(deCodificado);
  const conv = conversaciones[canalId]?.[de];

  // Generar un Nº de venta sólo si la conversación todavía no tiene uno
  let nro = conv?.nroVenta || null;
  if(!nro){
    // Traer la lista actual desde la nube para no repetir números
    try{
      const { data } = await sb.from('crm_datos').select('valor').eq('clave','ventas_mensajes').maybeSingle();
      if(data && Array.isArray(data.valor)) ventasMensajes = data.valor;
    }catch(e){ /* seguimos con lo que tengamos en memoria */ }
    nro = generarNroVenta(ventasMensajes);
    ventasMensajes.push({
      nro_venta: nro,
      canal: canalId,
      de,
      cliente: (conv && conv.nombre) ? conv.nombre : de,
      agente: (sesionActual && (sesionActual.nombre || sesionActual.usuario)) || '',
      vendedor_id: (sesionActual && sesionActual.vendedorId) || null,
      // Equipo vendido (si se eligió uno)
      equipo_id: equipo ? equipo.id : null,
      modelo: equipo ? equipo.modelo : null,
      color: equipo ? (equipo.color || '') : null,
      imei: equipo ? (equipo.imei || '') : null,
      precio: equipo && equipo.precio!=null && equipo.precio!=='' ? Number(equipo.precio) : null,
      compra: equipo && equipo.compra!=null && equipo.compra!=='' ? Number(equipo.compra) : null,
      fecha: new Date().toISOString().slice(0,10),
      estado: 'reservado',
      creado_en: new Date().toISOString()
    });
    try{
      await sb.from('crm_datos').upsert({ clave:'ventas_mensajes', valor: ventasMensajes, actualizado_en: new Date().toISOString() });
    }catch(e){ console.error('No se pudo registrar la venta para el CRM', e); }
    // Reservar el equipo en el stock para que no se venda dos veces
    if(equipo && equipo.id) await marcarEquipoEstado(equipo.id, 'reservado');
  }

  if(conv){ conv.estadoVenta = 'venta'; conv.cerrada = true; conv.nroVenta = nro; if(equipo) conv.equipoVendido = equipo.modelo; }
  renderListaUnificada(); renderChatAbierto();
  await actualizarEstadoDB(canalId, de, 'venta');
}

function confirmarVentaConEquipo(equipoId){

/* ---------- CONVERSACIONES ---------- */
async function cargarHistorial(canalId){
  const { data, error } = await sb.from('mensajes').select('*').eq('canal', canalId).order('creado_en', { ascending:true });
  conversaciones[canalId] = {};
  if(!error){ (data||[]).forEach(m => agregarMensajeAConversacion(canalId, m)); }
}

function agregarMensajeAConversacion(canalId, m){
  if(!conversaciones[canalId]) conversaciones[canalId] = {};
  const de = m.de;
  if(!de) return;
  if(!conversaciones[canalId][de]) conversaciones[canalId][de] = { de, canal:canalId, nombre:null, mensajes:[], noLeidos:0, ultimoTime:null, cerrada:false };
  const conv = conversaciones[canalId][de];
  if(m.direccion === 'entrante' && m.nombre_contacto) conv.nombre = m.nombre_contacto;
  conv.mensajes.push(m);
  conv.ultimoTexto = m.texto;
  conv.ultimoTime = m.creado_en;
  conv.ultimoDireccion = m.direccion;
  if(m.direccion === 'entrante' && !m.leido) conv.noLeidos++;
}

function obtenerTodasLasConversaciones(){
  let todas = [];
  for(const canalId in conversaciones){
    for(const de in conversaciones[canalId]){
      todas.push(conversaciones[canalId][de]);
    }
  }
  return todas;
}

function renderFiltros(){
  const todas = obtenerTodasLasConversaciones();
  const totalNoLeidos = todas.reduce((s,c) => s + c.noLeidos, 0);

  let html = `<div class="filtro-btn ${filtroActual==='todos'?'active':''}" onclick="setFiltro('todos')">
    Todos <span class="unread-badge" style="${totalNoLeidos>0?'display:flex':''}">${totalNoLeidos>99?'99+':totalNoLeidos}</span>
  </div>`;

  CANALES.forEach(c => {
    const noLeidos = Object.values(conversaciones[c.id]||{}).reduce((s,cv) => s + cv.noLeidos, 0);
    html += `<div class="filtro-btn ${filtroActual===c.id?'active':''}" onclick="setFiltro('${c.id}')">
      <span class="dot-estado ${canalesEstado[c.id]?'ok':''}"></span>
      ${c.nombre}
      <span class="unread-badge" style="${noLeidos>0?'display:flex':''}">${noLeidos>99?'99+':noLeidos}</span>
    </div>`;
  });

  document.getElementById('filtros').innerHTML = html;
}

function setFiltro(f){
  filtroActual = f;
  renderFiltros();
  renderListaUnificada();
}

function renderListaUnificada(){
  const cont = document.getElementById('convList');
  if(!cont) return;

  let convs = obtenerTodasLasConversaciones();

  // Filtrar por canal
  if(filtroActual !== 'todos'){
    convs = convs.filter(c => c.canal === filtroActual);
  }

  // Filtrar por búsqueda
  const busqueda = (document.getElementById('buscarConv')?.value || '').trim().toLowerCase();
  if(busqueda){
    convs = convs.filter(c => {
      const nombre = (c.nombre || c.de || '').toLowerCase();
      return nombre.includes(busqueda);
    });
  }

  // Filtrar por agente (si no es admin)
  if(!esAdmin()){
    convs = convs.filter(c => {
      const asig = asignaciones[claveAsig(c.canal, c.de)];
      return !asig || asig.agente_usuario === sesionActual.usuario;
    });
  }

  // Ordenar por último mensaje
  convs.sort((a,b) => new Date(b.ultimoTime||0) - new Date(a.ultimoTime||0));

  // Actualizar badge total en filtros
  renderFiltros();

  if(!convs.length){
    cont.innerHTML = '<div class="conv-empty">No hay conversaciones' + (busqueda ? ' con esa búsqueda' : '') + '.<br>Cuando alguien te escriba, va a aparecer acá.</div>';
    return;
  }

  const esActiva = (c) => conversacionAbierta && conversacionAbierta.canal === c.canal && conversacionAbierta.de === c.de;

  cont.innerHTML = convs.map(c => {
    const asig = asignaciones[claveAsig(c.canal, c.de)];
    const cerrada = c.cerrada;
    let tag = '';
    const ev = c.estadoVenta;
    const estadoListaTag = ev === 'venta' ? `<span class="conv-estado-tag venta">💰 Venta${c.nroVenta?(' #'+c.nroVenta):''}</span>`
      : ev === 'indeciso' ? '<span class="conv-estado-tag indeciso">⏳ Indeciso</span>'
      : cerrada ? '<span class="conv-estado-tag cerrada">Cerrada</span>'
      : '';
    if(esAdmin()){
      const quienAtiende = asig ? '👤 ' + escapeHtml(asig.agente_nombre) : 'Sin asignar';
      const estadoFinal = estadoListaTag || (asig ? '<span class="conv-estado-tag activa">Activa</span>' : '');
      tag = `<div class="asig-tag">${quienAtiende}${estadoFinal ? ' · ' + estadoFinal : ''}</div>`;
    } else if(asig && asig.agente_usuario === sesionActual.usuario){
      const actTag = estadoListaTag || '<span class="conv-estado-tag activa">Activa</span>';
      tag = `<div class="asig-tag">Tu cliente · ${actTag}</div>`;
    }
    const hasUnread = c.noLeidos > 0;
    return `
    <div class="conv-item canal-${c.canal} ${esActiva(c)?'active':''} ${hasUnread?'has-unread':''}" onclick="abrirConversacion('${c.canal}','${encodeURIComponent(c.de)}')">
      <div class="conv-avatar-wrap">
        <div class="conv-avatar">${inicialesMostradas(c)}</div>
        ${platIcon(c.canal)}
      </div>
      <div class="conv-info">
        <div class="nombre"><span>${escapeHtml(nombreMostrado(c))}</span><span class="hora">${fmtHoraLista(c.ultimoTime)}</span></div>
        <div class="preview">${c.ultimoDireccion==='saliente' ? 'Vos: ' : ''}${escapeHtml(c.ultimoTexto||'')}</div>
        ${tag}
      </div>
      ${hasUnread ? `<div class="conv-unread">${c.noLeidos}</div>` : ''}
    </div>`;
  }).join('');

  actualizarCupoAgente();
}

async function abrirConversacion(canalId, deCodificado){
  const de = decodeURIComponent(deCodificado);

  // Límite de clientes simultáneos para agentes (los administradores no tienen tope)
  if(!esAdmin()){
    const asig = asignaciones[claveAsig(canalId, de)];
    const yaEsMia = asig && asig.agente_usuario === sesionActual.usuario;
    if(!yaEsMia){
      if(misConversacionesActivas().length >= LIMITE_CONV_ACTIVAS){
        alert(`Ya estás atendiendo ${LIMITE_CONV_ACTIVAS} clientes al mismo tiempo.\n\nMarcá una conversación como "Venta cerrada" o "Indeciso" (o cerrala) para poder abrir otra.`);
        return;
      }
      // Al abrir un cliente nuevo, queda reclamado por este agente
      const puedo = await reclamarConversacion(canalId, de);
      if(!puedo){
        renderListaUnificada();
        alert('Esa conversación ya fue tomada por otro agente.');
        return;
      }
      renderListaUnificada();
    }
  }

  conversacionAbierta = { canal: canalId, de };
  const conv = conversaciones[canalId]?.[de];
  if(conv && conv.noLeidos > 0){
    conv.noLeidos = 0;
    conv.mensajes.forEach(m => { if(m.direccion==='entrante') m.leido = true; });
    sb.from('mensajes').update({ leido:true }).eq('canal', canalId).eq('de', de).eq('direccion','entrante').eq('leido', false).then(()=>{});
  }
  renderListaUnificada();
  renderChatAbierto();
  const shell = document.getElementById('chatShell');
  if(shell) shell.classList.add('chat-open');
}

function volverALista(){
  const shell = document.getElementById('chatShell');
  if(shell) shell.classList.remove('chat-open');
}

function renderChatAbierto(){
  const area = document.getElementById('chatArea');
  if(!area) return;
  if(!conversacionAbierta){
    area.innerHTML = `<div class="chat-vacio">Elegí una conversación de la izquierda para ver los mensajes.</div>`;
    return;
  }
  const { canal, de } = conversacionAbierta;
  const conv = conversaciones[canal]?.[de];
  if(!conv){
    area.innerHTML = `<div class="chat-vacio">Conversación no encontrada.</div>`;
    return;
  }
  const canalInfo = CANALES.find(c => c.id === canal);
  const asig = asignaciones[claveAsig(canal, de)];
  const bloqueadoParaMi = !esAdmin() && asig && asig.agente_usuario !== sesionActual.usuario;
  const estaCerrada = conv.cerrada === true;
  const esMiCliente = asig && asig.agente_usuario === sesionActual?.usuario;
  const puedeGestionar = esAdmin() || esMiCliente;
  const estadoConv = conv.estadoVenta || null; // 'venta' | 'indeciso' | null

  function estadoTagHTML(){
    if(estadoConv === 'venta') return `<span class="conv-estado-tag venta">💰 Venta Cerrada</span>`;
    if(estadoConv === 'indeciso') return `<span class="conv-estado-tag indeciso">⏳ Indeciso</span>`;
    if(estaCerrada) return `<span class="conv-estado-tag cerrada">● Cerrada</span>`;
    if(asig) return `<span class="conv-estado-tag activa">● Activa</span>`;
    return '';
  }

  let asigInfo = '';
  if(esAdmin()){
    let partes = [];
    if(asig) partes.push(`Atiende <b>${escapeHtml(asig.agente_nombre)}</b><a onclick="liberarConversacion('${canal}','${encodeURIComponent(de)}')">Liberar</a>`);
    else partes.push('Sin asignar');
    partes.push(estadoTagHTML());
    asigInfo = `<div class="chat-asig">${partes.join(' · ')}</div>`;
  } else if(esMiCliente){
    asigInfo = `<div class="chat-asig">Tu cliente · ${estadoTagHTML()}</div>`;
  }

  const deEnc = encodeURIComponent(de);
  let statusBtns = '';
  if(puedeGestionar && asig){
    let btns = [];
    if(estadoConv !== 'venta') btns.push(`<button class="btn-venta" onclick="abrirSelectorEquipoVenta('${canal}','${deEnc}')">💰 Venta Cerrada</button>`);
    if(estadoConv !== 'indeciso') btns.push(`<button class="btn-indeciso" onclick="marcarIndeciso('${canal}','${deEnc}')">⏳ Indeciso</button>`);
    if(!estaCerrada) btns.push(`<button class="btn-cerrar-conv" onclick="cerrarConv('${canal}','${deEnc}')">Cerrar</button>`);
    if(estaCerrada) btns.push(`<button class="btn btn-sm" onclick="reabrirConv('${canal}','${deEnc}')">Reabrir</button>`);
    if(estadoConv) btns.push(`<button class="btn-cerrar-conv" onclick="quitarEstadoVenta('${canal}','${deEnc}')" style="border-color:rgba(255,255,255,0.15);color:var(--txt3)">✕ Quitar estado</button>`);
    statusBtns = `<div class="chat-status-btns">${btns.join('')}</div>`;
  }

  // Barra de Nº de venta (cuando la conversación está marcada como venta cerrada)
  let ventaBar = '';
  if(estadoConv === 'venta' && conv.nroVenta){
    ventaBar = `<div class="venta-bar">
      <div class="venta-bar-nro">🧾 Nº de Venta: <b>${conv.nroVenta}</b>${conv.equipoVendido ? ` <span class="venta-bar-eq">📱 ${escapeHtml(conv.equipoVendido)}</span>` : ''}</div>
      ${!bloqueadoParaMi ? `<button class="btn-enviar-nro" onclick="enviarNroVentaCliente('${canal}','${deEnc}')">📤 Enviar Nº al cliente</button>` : ''}
    </div>`;
  }

  let replyArea = '';
  if(bloqueadoParaMi){
    replyArea = `<div class="chat-bloqueado">Esta conversación ya está siendo atendida por ${escapeHtml(asig.agente_nombre)}.</div>`;
  } else if(estaCerrada){
    replyArea = `<div class="chat-bloqueado">Conversación cerrada. ${puedeGestionar ? `<a style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="reabrirConv('${canal}','${encodeURIComponent(de)}')">Reabrir para responder</a>` : ''}</div>`;
  } else {
    replyArea = `<div class="reply-box">
          <div class="plat-send-indicator">${platIcon(canal)} <span>vía ${canalInfo?.nombre||canal}</span></div>
          <button class="btn-catalogo" onclick="toggleCatalogo()">📱 Catálogo</button>
          <input id="chatInput" placeholder="Escribí una respuesta..." onkeydown="if(event.key==='Enter') enviarDesdeChat()">
          <button class="btn" onclick="enviarDesdeChat()">Enviar</button>
        </div>
        <div id="catalogoPanel" style="display:none;"></div>`;
  }

  area.innerHTML = `
    <div class="chat-header">
      <span class="back-btn" onclick="volverALista()">‹ Volver</span>
      <div class="conv-avatar-wrap">
        <div class="conv-avatar">${inicialesMostradas(conv)}</div>
        ${platIcon(canal)}
      </div>
      <div style="flex:1; min-width:0;">
        <div class="nombre">${escapeHtml(nombreMostrado(conv))}</div>
        <div class="idcontacto">${platTag(canal)} ${esAdmin() ? escapeHtml(conv.de) : '<span style="color:var(--txt3);">🔒 Identidad protegida</span>'}</div>
      </div>
      ${asigInfo}
      ${statusBtns}
    </div>
    ${ventaBar}
    <div class="chat-messages" id="chatMsgs"></div>
    ${replyArea}`;

  const msgsCont = document.getElementById('chatMsgs');
  conv.mensajes.forEach(m => pintarBurbuja(msgsCont, m));
  msgsCont.scrollTop = msgsCont.scrollHeight;
}

function pintarBurbuja(cont, m){
  if(!cont) return;
  const div = document.createElement('div');
  div.className = 'msg ' + (m.direccion === 'entrante' ? 'in' : 'out');
  div.innerHTML = `${escapeHtml(m.texto)}<div class="hora">${fmtHora(m.creado_en)}</div>`;
  cont.appendChild(div);
}

async function enviarDesdeChat(){
  if(!conversacionAbierta) return;
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  const { canal, de } = conversacionAbierta;
  if(!texto || !de) return;
  input.disabled = true;

  if(!esAdmin()){
    const puedo = await reclamarConversacion(canal, de);
    if(!puedo){
      renderChatAbierto();
      renderListaUnificada();
      return;
    }
    renderListaUnificada();
  }

  try{
    const { data, error } = await sb.functions.invoke('enviar-mensaje', { body: { canal, destinatario:de, texto } });
    if(error) throw new Error(error.message || 'Error de conexión');
    if(data && !data.ok) throw new Error(data.error || 'Error al enviar');
    input.value = '';
  }catch(e){
    const msgsCont = document.getElementById('chatMsgs');
    if(msgsCont){
      const av = document.createElement('div');
      av.style.cssText = 'color:var(--red); font-size:11px; text-align:center; padding:6px;';
      av.textContent = 'No se pudo enviar: ' + (e.message || e);
      msgsCont.appendChild(av);
      msgsCont.scrollTop = msgsCont.scrollHeight;
    }
  }
  input.disabled = false;
  input.focus();
}

/* ---------- CATÁLOGO DE EQUIPOS (desde CRM) ---------- */
let catalogoEquipos = [];
let catalogoFotos = {};
let catalogoAbierto = false;

async function cargarCatalogo(){
  try{
    const { data, error } = await sb.from('crm_datos').select('valor').eq('clave','stock_equipos').maybeSingle();
    if(error || !data) return [];
    const todos = data.valor || [];
    return todos.filter(e => e.estado === 'disponible');
  }catch(e){ console.error('Error cargando catálogo', e); return []; }
}

async function cargarFotosCatalogo(){
  try{
    const { data, error } = await sb.from('marketing_media').select('*');
    if(error || !data) return {};
    const mapa = {};
    data.forEach(m => {
      if(!mapa[m.equipo_id]) mapa[m.equipo_id] = [];
      mapa[m.equipo_id].push(m);
    });
    return mapa;
  }catch(e){ console.error('Error cargando fotos catálogo', e); return {}; }
}

async function toggleCatalogo(){
  const panel = document.getElementById('catalogoPanel');
  if(!panel) return;
  if(catalogoAbierto){ panel.style.display='none'; catalogoAbierto=false; return; }
  panel.style.display='block';
  catalogoAbierto = true;
  panel.innerHTML = '<div class="catalogo-empty">Cargando equipos...</div>';
  const [equipos, fotos] = await Promise.all([cargarCatalogo(), cargarFotosCatalogo()]);
  catalogoEquipos = equipos;
  catalogoFotos = fotos;
  renderCatalogo();
}

function renderCatalogo(filtro=''){
  const panel = document.getElementById('catalogoPanel');
  if(!panel) return;
  const q = filtro.toLowerCase();
  const filtrados = catalogoEquipos.filter(e => !q || (e.modelo+' '+e.color+' '+(e.bateria||'')).toLowerCase().includes(q));

  panel.innerHTML = `
    <div class="catalogo-panel">
      <div class="catalogo-header">
        <h3>📱 Catálogo de equipos</h3>
        <input placeholder="Buscar modelo..." oninput="renderCatalogo(this.value)" value="${filtro}">
        <button class="cerrar-cat" onclick="toggleCatalogo()">✕</button>
      </div>
      ${filtrados.length ? `<div class="catalogo-grid">${filtrados.map(e => {
        const precio = e.sugerido ? `$${Number(e.sugerido).toLocaleString('es-AR')}` : 'Consultar';
        const fotos = catalogoFotos[e.id] || [];
        const fotoImg = fotos.length > 0 && fotos[0].tipo === 'imagen'
          ? `<div class="cat-photo"><img src="${fotos[0].url}" alt="${escapeHtml(e.modelo)}" loading="lazy">${fotos.length > 1 ? `<span class="cat-photo-count">${fotos.length} fotos</span>` : ''}</div>`
          : `<div class="cat-no-photo">📱</div>`;
        return `<div class="cat-card">
          ${fotoImg}
          <div class="cat-body">
            <div class="cat-modelo">${escapeHtml(e.modelo)}</div>
            <div class="cat-detalle">
              Color: ${escapeHtml(e.color || '-')}<br>
              Batería: ${escapeHtml(e.bateria || '-')}%
            </div>
            <div class="cat-precio">${precio}</div>
            <div class="cat-actions">
              <button class="cat-send-info" onclick="enviarInfoEquipo('${e.id}')">📤 Info</button>
              ${fotos.length ? `<button class="cat-send-foto" onclick="enviarFotoEquipo('${e.id}')">📷 Foto</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('')}</div>` : '<div class="catalogo-empty">No hay equipos disponibles.</div>'}
    </div>`;
}

async function enviarInfoEquipo(equipoId){
  if(!conversacionAbierta) return;
  const equipo = catalogoEquipos.find(e => e.id === equipoId);
  if(!equipo) return;
  const precio = equipo.sugerido ? `$${Number(equipo.sugerido).toLocaleString('es-AR')}` : 'Consultar precio';
  const texto = `📱 *${equipo.modelo}*\n` +
    `🎨 Color: ${equipo.color || '-'}\n` +
    `🔋 Batería: ${equipo.bateria || '-'}%\n` +
    `💲 Precio: ${precio}`;

  const { canal, de } = conversacionAbierta;

  if(!esAdmin()){
    const puedo = await reclamarConversacion(canal, de);
    if(!puedo){ renderChatAbierto(); renderListaUnificada(); return; }
    renderListaUnificada();
  }

  try{
    const { data, error } = await sb.functions.invoke('enviar-mensaje', { body: { canal, destinatario:de, texto } });
    if(error) throw new Error(error.message || 'Error');
    if(data && !data.ok) throw new Error(data.error || 'Error al enviar');
    catalogoAbierto = false;
    const panel = document.getElementById('catalogoPanel');
    if(panel) panel.style.display = 'none';
  }catch(e){
    alert('No se pudo enviar la info del equipo: ' + (e.message||e));
  }
}

async function enviarFotoEquipo(equipoId){
  if(!conversacionAbierta) return;
  const equipo = catalogoEquipos.find(e => e.id === equipoId);
  const fotos = catalogoFotos[equipoId] || [];
  if(!equipo || !fotos.length) return;
  const foto = fotos[0];
  const precio = equipo.sugerido ? `$${Number(equipo.sugerido).toLocaleString('es-AR')}` : 'Consultar precio';
  const texto = `📱 *${equipo.modelo}*\n` +
    `🎨 Color: ${equipo.color || '-'}\n` +
    `🔋 Batería: ${equipo.bateria || '-'}%\n` +
    `💲 Precio: ${precio}\n\n` +
    `📷 ${foto.url}`;

  const { canal, de } = conversacionAbierta;

  if(!esAdmin()){
    const puedo = await reclamarConversacion(canal, de);
    if(!puedo){ renderChatAbierto(); renderListaUnificada(); return; }
    renderListaUnificada();
  }

  try{
    const { data, error } = await sb.functions.invoke('enviar-mensaje', { body: { canal, destinatario:de, texto } });
    if(error) throw new Error(error.message || 'Error');
    if(data && !data.ok) throw new Error(data.error || 'Error al enviar');
    catalogoAbierto = false;
    const panel = document.getElementById('catalogoPanel');
    if(panel) panel.style.display = 'none';
  }catch(e){
    alert('No se pudo enviar la foto del equipo: ' + (e.message||e));
  }
}

/* ---------- INICIO ---------- */
function reaplicarEstadosAsignaciones(){
  // Las asignaciones se cargan antes que los historiales, así que volvemos a
  // aplicar el estado (venta/indeciso/cerrada) sobre las conversaciones ya cargadas.
  for(const key in asignaciones){
    const a = asignaciones[key];
    const conv = conversaciones[a.canal]?.[a.de];
    if(!conv || !a.estado) continue;
    if(a.estado === 'venta'){ conv.estadoVenta = 'venta'; conv.cerrada = true; }
    else if(a.estado === 'indeciso'){ conv.estadoVenta = 'indeciso'; }
    else if(a.estado === 'cerrada'){ conv.cerrada = true; conv.estadoVenta = null; }
    else { conv.cerrada = false; conv.estadoVenta = null; }
  }
}

async function cargarVentasMensajes(){
  try{
    const { data } = await sb.from('crm_datos').select('valor').eq('clave','ventas_mensajes').maybeSingle();
    ventasMensajes = (data && Array.isArray(data.valor)) ? data.valor : [];
  }catch(e){ ventasMensajes = ventasMensajes || []; }
  // Asociar el Nº de venta a cada conversación (el más reciente de cada cliente)
  ventasMensajes.forEach(r => {
    const conv = conversaciones[r.canal]?.[r.de];
    if(conv){ conv.nroVenta = r.nro_venta; if(r.modelo) conv.equipoVendido = r.modelo; }
  });
}

/* ---------- AGENDA AUTOMÁTICA DE CLIENTES DE WHATSAPP EN EL CRM ----------
   Cada número de WhatsApp que escribe se agenda en el CRM (sección Clientes)
   como "Cliente 1", "Cliente 2", etc., con el teléfono. No se duplican. */
function uid(){ return 'wa'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function soloDigitos(s){ return String(s||'').replace(/\D/g,''); }
let _syncClientesEnCurso = false;

async function agendarClientesWhatsapp(){
  if(_syncClientesEnCurso) return;
  const waConvs = conversaciones['whatsapp'] ? Object.keys(conversaciones['whatsapp']) : [];
  if(!waConvs.length) return;
  _syncClientesEnCurso = true;
  try{
    // Traer lo último de clientes desde la nube para no pisar cambios del CRM
    let clientesCRM = [];
    const { data } = await sb.from('crm_datos').select('valor').eq('clave','clientes').maybeSingle();
    clientesCRM = (data && Array.isArray(data.valor)) ? data.valor : [];

    const telsExistentes = new Set(clientesCRM.map(c => soloDigitos(c.telefono)).filter(Boolean));
    let maxNum = clientesCRM.reduce((mx,c)=>{
      if(c.nombre==='Cliente' && /^\d+$/.test(String(c.apellido||''))) return Math.max(mx, parseInt(c.apellido,10));
      return mx;
    }, 0);

    let agregados = 0;
    waConvs.forEach(de => {
      const tel = soloDigitos(de);
      if(!tel || telsExistentes.has(tel)) return; // ya agendado (por el CRM o automáticamente)
      maxNum++;
      clientesCRM.push({ id: uid(), nombre:'Cliente', apellido:String(maxNum), dni:'', telefono:de, direccion:'' });
      telsExistentes.add(tel);
      agregados++;
    });

    if(agregados > 0){
      await sb.from('crm_datos').upsert({ clave:'clientes', valor: clientesCRM, actualizado_en: new Date().toISOString() });
    }
  }catch(e){
    console.error('No se pudieron agendar clientes de WhatsApp en el CRM', e);
  }finally{
    _syncClientesEnCurso = false;
  }
}

async function iniciarApp(){
  await cargarAsignaciones();

  for(const c of CANALES){
    const { activo } = await cargarConfig(c.id);
    canalesEstado[c.id] = !!activo;
    await cargarHistorial(c.id);
  }

  reaplicarEstadosAsignaciones();
  await cargarVentasMensajes();
  await agendarClientesWhatsapp();

  renderFiltros();
  renderListaUnificada();

  // Realtime: asignaciones
  sb.channel('asignaciones-en-vivo')
    .on('postgres_changes', { event:'*', schema:'public', table:'conversaciones_asignadas' }, payload => {
      if(payload.eventType === 'DELETE'){
        const old = payload.old;
        delete asignaciones[claveAsig(old.canal, old.de)];
      } else {
        const row = payload.new;
        asignaciones[claveAsig(row.canal, row.de)] = row;
      }
      renderListaUnificada();
      if(conversacionAbierta) renderChatAbierto();
    })
    .subscribe();

  // Realtime: mensajes
  sb.channel('mensajes-en-vivo')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'mensajes' }, payload => {
      const m = payload.new;
      agregarMensajeAConversacion(m.canal, m);
      if(m.canal === 'whatsapp' && m.direccion === 'entrante') agendarClientesWhatsapp();
      renderListaUnificada();
      if(conversacionAbierta && conversacionAbierta.canal === m.canal && conversacionAbierta.de === m.de){
        const msgsCont = document.getElementById('chatMsgs');
        pintarBurbuja(msgsCont, m);
        if(msgsCont) msgsCont.scrollTop = msgsCont.scrollHeight;
        if(m.direccion === 'entrante'){
          conversaciones[m.canal][m.de].noLeidos = 0;
          sb.from('mensajes').update({ leido:true }).eq('id', m.id).then(()=>{});
          renderListaUnificada();
        }
      }
    })
    .subscribe(status => {
      const el = document.getElementById('estadoConexion');
      if(el){
        el.textContent = status === 'SUBSCRIBED' ? 'En vivo ✓' : 'Conectando...';
        el.style.color = status === 'SUBSCRIBED' ? 'var(--green)' : 'var(--txt3)';
      }
    });
}
